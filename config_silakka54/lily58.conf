# ==========================================
# Silakka54 ZMK 全局通用配置（左右手共享）
# ==========================================
CONFIG_ZMK_KEYBOARD_NAME="Silakka54"

# ==========================================
# 1. 蓝牙底层与射频稳定性（SuperMini 保命必须，左右手必须同时生效）
# ==========================================
# 强制使用内部 RC 振荡器并声明 500ppm 精度（解决休眠唤醒断连、丢包）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 禁用 2M PHY，强制退回 1M 保障信号稳定性
CONFIG_BT_CTLR_PHY_2M=n
# 增强 nRF52840 发射功率至 +8 dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 绕过 Windows 11 GATT 电量通知断联 Bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# [新增说明] 开启官方最新连接层优化。
# [来源] ZMK 官方文档 (Bluetooth Configuration) 的实验性参数。
# [原因] 这个参数专为复杂环境分体键盘设计，底层优化了设备间的配对重连与数据包间隔，替代了旧版手动写死的调度配置。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ==========================================
# 2. 蓝牙调度优化（防止分体键盘左右手与主机抢占信号）
# ==========================================
# 给左右手通信留出射频时间片 (15ms ~ 30ms)
# [删除说明] 移除旧时代手动控制信号时间的参数。
# [原因] 既然启用了 EXPERIMENTAL_CONN，旧的硬编码参数会与新调度算法起冲突，反而导致抢信号断连。
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ==========================================
# 3. 内存与底层队列扩容（防高频 Pointing 导致栈溢出或丢包）
# ==========================================
# 扩大蓝牙 RX 缓冲和 L2CAP 队列
# [修改说明] 将系统栈从 4096 缩减为 2048。
# [原因] ZMK 官方默认值仅为 1024。4096 过于浪费 SRAM 内存，可能会挤占蓝牙缓冲池。2048 已经足够应付鼠标模拟。
# CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
# [修改说明] 将 L2CAP 队列扩大到 10，并新增底层 ACL 缓存拓宽。
# [来源] Zephyr 蓝牙协议栈 Host 层优化指南。
# [原因] 当 2.4G 干扰大时，数据包发不出去会被暂时存放在 ACL 队列中。默认只有 3-5 个坑位，瞬间塞满就会导致断连和丢键。增加队列相当于“加宽车道”，让受干扰的数据包有地方排队，干扰一过（几毫秒）瞬间发走，解决假死断连。
# CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_L2CAP_TX_MTU=65
# [新增补丁] 满足 Zephyr 的安全断言要求，Event RX 必须大于 ACL TX
CONFIG_BT_BUF_EVT_RX_COUNT=16

# 提升主线程与系统工作队列堆栈大小
# CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# [已禁用] 实验性蓝牙功能 — 在 Zephyr 4.1+ 中部分子选项已废弃或合入主线，
# 开启后可能引入未预期行为，暂时关闭观察稳定性
# CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# [已禁用] BLE 线程栈与行为队列扩容 — 移除实验性功能后这两项不再必要，
# 保留默认值即可，减少不必要的内存占用
# CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024
# CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# ==========================================
# 4. 电源与休眠
# ==================================
CONFIG_ZMK_BATTERY_REPORTING=y
# 禁用深度休眠（永不休眠，避免断联后需要按键唤醒）
# [说明] 坚决不休眠 (SLEEP=n)。
# [原因] 因为你的电池高达 1000mAh，按键盘待机时约 2mA 电流计算，即使永远不深度休眠（即点即亮 0 延迟），纯待机也能硬扛超过 20 天（500小时）。完全不需要受重连延迟的气。
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=10800000  # 如需恢复休眠，改 SLEEP=y 并取消此行注释

# ==========================================
# 5. 鼠标模拟 (Pointing)
# ==========================================
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
