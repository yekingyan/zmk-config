# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- 蓝牙稳定性优化 (从 Lily58 验证过的配置移植) ---
CONFIG_BT_CTLR_PHY_2M=n
# 增强发射功率（+8 dBm，自制 PCB 天线不佳时必需）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# ==========================================
# 1. 时钟漂移修复（针对 SuperMini 克隆板的保命配置）
# ==========================================
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# 【关键】必须显式声明 RC 振荡器的精度为 500ppm！
# 否则 Zephyr 会使用过窄的接收窗口，导致漂移时必然漏接数据包 (reason 34)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================
# 4. 恢复实验性功能与信号增强
# ==========================================
# 实验性蓝牙功能（建议开启，包含新版 Zephyr 的连接重试机制，对防断连有奇效）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
# 使用 ZMK 默认电量上报间隔，无需手动指定激进轮询

# Mouse emulation
CONFIG_ZMK_POINTING=y

# ==========================================
# 3. 链路层与底层队列优化（防 Pointing 拥塞）
# ==========================================
# 增加底层蓝牙控制器 (Controller) 的 TX 缓冲区，防止突发高频打字/鼠标模拟撑爆队列
CONFIG_BT_CTLR_TX_BUFFERS=10
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# 增加蓝牙 RX 线程堆栈大小，防止分体并发处理死锁
CONFIG_BT_RX_STACK_SIZE=2048

# --- 蓝牙缓冲区与栈空间 ---
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ==========================================
# 2. 蓝牙调度与间隔（避免左右手与 PC 的无线电抢占）
# ==========================================
# 强制拉开与 PC 的通信间隔，限制在 15ms ~ 30ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 行为队列
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
