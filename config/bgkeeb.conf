# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 禁用深度休眠（永不休眠，避免断联后需要按键唤醒）
# [说明] 坚决不休眠 (SLEEP=n)。
# [原因] 因为你的电池高达 1000mAh，按键盘待机时约 2mA 电流计算，即使永远不深度休眠（即点即亮 0 延迟），纯待机也能硬扛超过 20 天（500小时）。完全不需要受重连延迟的气。
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=10800000  # 如需恢复休眠，改 SLEEP=y 并取消此行注释

# 禁用 2M PHY（硬件天线差导致 2M 时连不上，强制退回 1M 保命）
CONFIG_BT_CTLR_PHY_2M=n
# 增强发射功率（+8 dBm，自制 PCB 天线不佳时必需）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# ==========================================
# 1. 时钟漂移修复（针对 SuperMini 克隆板的保命配置）
# ==========================================
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 切换为外部晶振（降低待机功耗）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# 针对廉价晶振放宽公差要求，保障连接稳定性
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_50PPM=y
# [修改说明] 将晶振精度从 50PPM 放宽到 250PPM。
# [来源] Zephyr RTOS nRF 硬件时钟文档、ZMK 社区长期的寨板踩坑总结。
# [原因] 50PPM 要求极高，市面普通主控板的晶振受温度影响轻微漂移时，Zephyr 底层看门狗会判定硬件故障直接导致系统死锁。放宽到 250PPM 允许一定误差，极大提升防死机能力。
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# ==========================================
# 4. 恢复实验性功能与信号增强
# ==========================================
# 实验性蓝牙功能（建议开启，包含新版 Zephyr 的连接重试机制，对防断连有奇效）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
# 使用 ZMK 默认电量上报间隔，无需手动指定激进轮询

# Mouse emulation
CONFIG_ZMK_POINTING=y

# ==========================================
# 3. 链路层与底层队列优化（防 Pointing 拥塞）
# ==========================================
# 增加底层蓝牙控制器 (Controller) 的 TX 缓冲区，防止突发高频打字/鼠标模拟撑爆队列
# [FIX] Zephyr 4.1 废弃了 BT_CTLR_TX_BUFFERS，且 DATA_LENGTH_MAX 上限严格限制在 27-69，恢复默认
# CONFIG_BT_CTLR_TX_BUFFERS=10
# CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# 扩大蓝牙 RX 缓冲，防止瞬间数据包风暴导致丢包
# [修改说明] 将系统栈从 4096 缩减为 2048。
# [原因] ZMK 官方默认值仅为 1024。4096 过于浪费 SRAM 内存，可能会挤占蓝牙缓冲池。2048 已经足够应付鼠标模拟。
# CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048

# --- 蓝牙缓冲区与栈空间 ---
# [修改说明] 将 L2CAP 队列扩大到 10，并新增底层 ACL 缓存拓宽。
# [来源] Zephyr 蓝牙协议栈 Host 层优化指南。
# [原因] 当 2.4G 干扰大时，数据包发不出去会被暂时存放在 ACL 队列中。默认只有 3-5 个坑位，瞬间塞满就会导致断连和丢键。增加队列相当于“加宽车道”，让受干扰的数据包有地方排队，干扰一过（几毫秒）瞬间发走，解决假死断连。
# CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_L2CAP_TX_MTU=65
# 提升主线程堆栈
# CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
# 提升系统工作队列的堆栈大小，防止高并发时栈溢出或阻塞
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 增加蓝牙连接管理器的工作队列，缓解 -22 错误
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024

# ==========================================
# 2. 蓝牙调度与间隔（避免左右手与 PC 的无线电抢占）
# ==========================================
# 强制拉开与 PC 的通信间隔，限制在 15ms ~ 30ms
# [删除说明] 移除旧时代手动控制信号时间的参数。
# [原因] 既然启用了 EXPERIMENTAL_CONN，旧的硬编码参数会与新调度算法起冲突，反而导致抢信号断连。
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 行为队列
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
