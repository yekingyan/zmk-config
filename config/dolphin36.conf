# ==========================================
# Dolphin36 ZMK 全局通用配置（左右手共享）
# 与 Dolphin1 保持一致，仅键盘名不同
# ==========================================
CONFIG_ZMK_KEYBOARD_NAME="Dolphin36"

# ==========================================
# 1. 蓝牙底层与射频稳定性（SuperMini 保命必须，左右手必须同时生效）
# ==========================================
# 强制使用内部 RC 振荡器并声明 500ppm 精度（解决休眠唤醒断连、丢包）
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 切换为外部晶振（降低待机功耗）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# 针对廉价晶振放宽公差要求，保障连接稳定性（50PPM 太严会触发底层看门狗死锁）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# 禁用 2M PHY，强制退回 1M 保障信号稳定性
CONFIG_BT_CTLR_PHY_2M=n
# 增强 nRF52840 发射功率至 +8 dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 绕过 Windows 11 GATT 电量通知断联 Bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 开启官方最新连接层优化（专为复杂环境分体键盘设计，替代手写调度参数）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ==========================================
# 2. 内存与底层队列扩容（防高频 Pointing 导致栈溢出或丢包）
# ==========================================
CONFIG_BT_RX_STACK_SIZE=2048
# 拓宽 L2CAP / ACL 队列，给受干扰的数据包留排队车道，避免假死断连
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_L2CAP_TX_MTU=65
# 满足 Zephyr 的安全断言要求，Event RX 必须大于 ACL TX
CONFIG_BT_BUF_EVT_RX_COUNT=16

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ==========================================
# 3. 电源与休眠
# ==========================================
CONFIG_ZMK_BATTERY_REPORTING=y
# 禁用深度休眠（1000mAh 电池足够硬扛，换取 0 延迟即点即亮）
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=10800000  # 如需恢复休眠，改 SLEEP=y 并取消此行注释

# ==========================================
# 4. 鼠标模拟 (Pointing)
# ==========================================
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
