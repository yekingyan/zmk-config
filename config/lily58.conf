# Display (Nice!View / Sharp Memory LCD)
# CONFIG_ZMK_DISPLAY=y

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Lily58_OSM"

# 开启 ZMK USB 日志输出功能 (调试时使用，平时不用请关闭，避免耗电或卡死)
CONFIG_ZMK_USB_LOGGING=n

# --- 蓝牙稳定性优化 ---
# Connectivity stability fixes (针对克隆板/SuperMini，禁用 2M PHY 强制使用更稳的 1M PHY)
CONFIG_BT_CTLR_PHY_2M=n

# 增强发射功率（+8 dBm，自制 PCB 天线不佳时必需）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 强制使用内部 RC 振荡器（针对没有外部晶振的 nice!nano 克隆板/SuperMini）
# 解决 0x22 LMP Response Timeout 的真凶
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# --- Windows 11 专项修复 ---
# 绕过 Windows 11 烦人的 GATT 电量通知断联 Bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 实验性蓝牙功能（与 RC 时钟冲突，控制实验中关闭）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
# --- 开启安全配对码 (核心修改) ---
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
# 使用 ZMK 默认电量上报间隔，无需手动指定激进轮询

# 开启深度休眠开关 (必须加这一行，Timeout 才会生效)
CONFIG_ZMK_SLEEP=y
# Deep sleep (15 min idle)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse emulation (Layer 5: Mouse)
CONFIG_ZMK_POINTING=y

# Combos (JK=Esc, FJ=CapsWord, DF=Ctrl+Shift)
# ZMK 现代版本已支持自动计算 Combo 资源，无需再手动指定限制

# 开启 ZMK Studio 核心功能
# [排查发热] 暂时关闭，Zephyr 4.1 后有已知的休眠/耗电 Bug
# CONFIG_ZMK_STUDIO=y
# (可选) 关闭默认的 Studio 锁。
# ZMK Studio 默认出于安全考虑是锁定的，需要按特定快捷键解锁。
# CONFIG_ZMK_STUDIO_LOCKING=n

# 增加蓝牙 L2CAP 发送缓冲区数量（默认通常是 3 或 4，增加到 8 或更高）
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
# 增加蓝牙 L2CAP 动态缓冲区大小
CONFIG_BT_L2CAP_TX_MTU=65

# 扩大主线程和系统工作队列的内存栈
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 已删除 PREF_MIN/MAX_INT 以保证 RC 时钟宽容度

# 把蓝牙超时判定从 4 秒延长到 8 秒（容忍 Windows 偶尔的底层卡顿）
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800

# 增加 ZMK 系统的工作队列容量，应对高频并发打字
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
