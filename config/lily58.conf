# Display (Nice!View / Sharp Memory LCD)
# CONFIG_ZMK_DISPLAY=y

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Lily58_OSM"

# --- 蓝牙稳定性优化 ---
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# 曾降低发射功率解决近距离丢包，现因打字频繁断联，改为增强发射功率以提升连接稳定性
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_BT_CTLR_TX_PWR_0=y
# Connectivity stability fixes (禁用 2M PHY，提升兼容性)
CONFIG_BT_CTLR_PHY_2M=n

# --- Windows 11 专项修复 ---
# 绕过 Windows 11 烦人的 GATT 电量通知断联 Bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 修复 Win11 断流 + 开启配对码 + 自动覆盖死链接
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# --- 开启安全配对码 (核心修改) ---
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# 开启深度休眠开关 (必须加这一行，Timeout 才会生效)
CONFIG_ZMK_SLEEP=y
# Deep sleep (15 min idle)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse emulation (Layer 5: Mouse)
CONFIG_ZMK_POINTING=y

# Combos (JK=Esc, FJ=CapsWord, DF=Ctrl+Shift)
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# 开启 ZMK Studio 核心功能
# [排查发热] 暂时关闭，Zephyr 4.1 后有已知的休眠/耗电 Bug
# CONFIG_ZMK_STUDIO=y
# (可选) 关闭默认的 Studio 锁。
# ZMK Studio 默认出于安全考虑是锁定的，需要按特定快捷键解锁。
# CONFIG_ZMK_STUDIO_LOCKING=n

# 增加蓝牙 L2CAP 发送缓冲区数量（默认通常是 3 或 4，增加到 8 或更高）
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
# 增加蓝牙 L2CAP 动态缓冲区大小
CONFIG_BT_L2CAP_TX_MTU=65

# 扩大主线程和系统工作队列的内存栈
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 请求更短的连接间隔（提升高频输入的稳定性）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
