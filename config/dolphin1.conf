# Dolphin1 配置
# 基于 Ferris Sweep 自制 PCB，蓝牙稳定性配置同步自 Lily58

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Dolphin1"

# --- USB 日志 ---
CONFIG_ZMK_USB_LOGGING=y

# --- 蓝牙稳定性优化 ---
# 禁用 2M PHY（硬件天线差导致 2M 时连不上，强制退回 1M 保命）
CONFIG_BT_CTLR_PHY_2M=n

# 增强发射功率（+8 dBm，自制 PCB 天线不佳时必需）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ==========================================
# 1. 时钟漂移修复（针对 SuperMini 克隆板的保命配置）
# ==========================================
# 强制内部 RC 振荡器（SuperMini 必需，解决 0x22 LMP Response Timeout）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# 【关键】必须显式声明 RC 振荡器的精度为 500ppm！
# 否则 Zephyr 会使用过窄的接收窗口，导致漂移时必然漏接数据包 (reason 34)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================
# 4. 恢复实验性功能与信号增强
# ==========================================
# 实验性蓝牙功能（建议开启，包含新版 Zephyr 的连接重试机制，对防断连有奇效）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# --- Windows 11 专项修复 ---
# 绕过 Win11 GATT 电量通知断联 Bug（必需保留）
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- 电源与休眠 ---
CONFIG_ZMK_BATTERY_REPORTING=y
# 使用 ZMK 默认电量上报间隔，无需手动指定激进轮询

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ==========================================
# 3. 链路层与底层队列优化（防 Pointing 拥塞）
# ==========================================
# 增加底层蓝牙控制器 (Controller) 的 TX 缓冲区，防止突发高频打字/鼠标模拟撑爆队列
# [FIX] Zephyr 4.1 废弃了 BT_CTLR_TX_BUFFERS，且 DATA_LENGTH_MAX 上限严格限制在 27-69，恢复默认
# CONFIG_BT_CTLR_TX_BUFFERS=10
# CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# 扩大蓝牙 RX 缓冲，防止瞬间数据包风暴导致丢包
CONFIG_BT_RX_STACK_SIZE=4096

# --- 栈内存与队列扩容 ---
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_L2CAP_TX_MTU=65
# 提升主线程堆栈
CONFIG_MAIN_STACK_SIZE=4096
# 提升系统工作队列的堆栈大小，防止高并发时栈溢出或阻塞
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# 增加蓝牙连接管理器的工作队列，缓解 -22 错误
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# ==========================================
# 2. 蓝牙调度与间隔（避免左右手与 PC 的无线电抢占）
# ==========================================
# 强制拉开与 PC 的通信间隔。默认间隔通常是 7.5ms，这与左右手默认的 7.5ms 通信严重冲突。
# 将 PC 通信间隔限制在 15ms ~ 30ms，给左右手留出充足的射频时间片。
# 单位为 1.25ms (12 * 1.25 = 15ms; 24 * 1.25 = 30ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
# 保持 4 秒超时
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Mouse emulation (pointing)
# 排查期间临时关闭：高频坐标上报会加剧线程拥堵，确认打字稳定后重新开启
# CONFIG_ZMK_POINTING=y

# --- ZMK Studio ---
# 开启 ZMK Studio 核心功能
CONFIG_ZMK_STUDIO=y
# (可选) 关闭默认的 Studio 锁。
# ZMK Studio 默认出于安全考虑是锁定的，需要按特定快捷键解锁。
CONFIG_ZMK_STUDIO_LOCKING=n
