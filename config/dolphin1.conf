# Dolphin1 配置
# 基于 Ferris Sweep 自制 PCB，蓝牙稳定性配置同步自 Lily58

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Dolphin1"

# --- 蓝牙稳定性优化 ---
# 禁用 2M PHY（兼容老设备及提高复杂环境抗干扰）
CONFIG_BT_CTLR_PHY_2M=n

# 增强发射功率（如遇电压不稳或 split 通信异常，可取消注释）
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 开启所有蓝牙实验性功能（包含 CONN 稳定性和 SEC 配对修复）
# 注意：此选项取代了单独的 EXPERIMENTAL_CONN 和 EXPERIMENTAL_SEC
# 如遇 Win11 断流 0x22 timeout，改回 n 并单独启用 CONN/SEC
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# 开启安全配对码功能
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# 强制内部 RC 振荡器（SuperMini 必需，解决 0x22 LMP Response Timeout）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# --- Windows 11 专项修复 ---
# 绕过 Win11 GATT 电量通知断联 Bug（必需保留）
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- 电源与休眠 ---
CONFIG_ZMK_BATTERY_REPORTING=y
# 使用 ZMK 默认电量上报间隔，无需手动指定激进轮询

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- 栈内存与队列扩容 ---
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# 适当延长超时时间（容忍 RC 时钟漂移和 Win 偶尔卡顿）
# 已删除 PREF_MIN/MAX_INT 以保证 RC 时钟宽容度
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800

# Mouse emulation (pointing)
CONFIG_ZMK_POINTING=y
